<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="indigoGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Safe-zone scaled group (80% scale centered at 256, 256) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Interconnected Ecosystem Node Rings -->
    <circle cx="140" cy="140" r="16" fill="#6366f1" opacity="0.85" />
    <circle cx="372" cy="140" r="16" fill="#10b981" opacity="0.85" />
    <circle cx="140" cy="372" r="16" fill="#0ea5e9" opacity="0.85" />
    <circle cx="372" cy="372" r="16" fill="#f59e0b" opacity="0.85" />

    <!-- Connecting Node Lines -->
    <path d="M 140 140 L 256 256 L 372 140" stroke="#4f46e5" stroke-width="4" stroke-dasharray="6,6" opacity="0.4" fill="none" />
    <path d="M 140 372 L 256 256 L 372 372" stroke="#4f46e5" stroke-width="4" stroke-dasharray="6,6" opacity="0.4" fill="none" />

    <!-- Central Nexus Monogram 'N' -->
    <path d="M 176 156 L 220 156 L 220 356 L 176 356 Z" fill="url(#indigoGradMask)" />
    <path d="M 212 156 L 300 356 L 336 356 L 248 156 Z" fill="#6366f1" opacity="0.95" />
    <path d="M 292 156 L 336 156 L 336 356 L 292 356 Z" fill="url(#indigoGradMask)" />

    <!-- Pulse Orb -->
    <circle cx="256" cy="256" r="14" fill="#ffffff" />
    <circle cx="256" cy="256" r="24" fill="none" stroke="#818cf8" stroke-width="3" opacity="0.8" />
  </g>
</svg>
