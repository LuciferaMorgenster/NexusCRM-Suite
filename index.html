    <script>
      // Runtime dynamic absolute URL resolution for canonical, og:url, og:image
      (function() {
        try {
          var origin = window.location.origin;
          var fullImgUrl = origin + '/og-cover.jpg';
          var ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg) ogImg.setAttribute('content', fullImgUrl);
          var ogImgSec = document.querySelector('meta[property="og:image:secure_url"]');
          if (ogImgSec) ogImgSec.setAttribute('content', fullImgUrl);
          var twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg) twImg.setAttribute('content', fullImgUrl);
          var canonical = document.querySelector('link[rel="canonical"]');
          if (canonical) canonical.setAttribute('href', window.location.href);
          var ogUrl = document.createElement('meta');
          ogUrl.setAttribute('property', 'og:url');
          ogUrl.setAttribute('content', window.location.href);
          document.head.appendChild(ogUrl);
        } catch(e) {}
      })();
    </script>
